services:
  db:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ex_day_poc
    # HNSW の並列作成は共有メモリ（/dev/shm）を maintenance_work_mem の分だけ使う。
    # Docker の既定（64MB）では足りないため広げる（Issue #9）
    shm_size: 1gb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
  # OpenTripPlanner（Issue #7）。普段は起動しない（--profile otp を付けたときだけ）。
  # 入力（OSM の pbf と仮 GTFS の zip）とグラフは docker/otp/data に置く。手順は reach/otp/README.md
  otp:
    image: opentripplanner/opentripplanner:2.11.0_2026-10-02T08-35
    profiles: ["otp"]
    environment:
      # 関東の OSM でグラフを作るのに 10GB 前後使う。Docker に割り当てたメモリより数 GB 小さくすること
      JAVA_TOOL_OPTIONS: ${OTP_JAVA_OPTS:--Xmx12g}
    command: ["--load", "--serve"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/otp/data:/var/opentripplanner
volumes:
  postgres-data:
